<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bestellmail Polaroid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #e9e9ea;
    --ink: #1b1b1b;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    --brand: #f07d00;
    --ok-bg: #dff5e3;
    --ok-ink: #17692b;
    --accent: #f07d00;
    --hand: "Caveat", "Comic Sans MS", cursive;
  }
  /* bewusst nur heller Look: E-Mail-Vorschau wie im Postfach */
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); font-family: Inter, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  /* ---------- Steuerleiste ---------- */
  .toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #fff; border-bottom: 1px solid #ddd; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: center; }
  .group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .group > span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #888; }
  .seg { display: inline-flex; flex-wrap: wrap; background: #f1f1f1; border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 6px; cursor: pointer; color: #555; }
  .seg button[aria-pressed="true"] { background: #1b1b1b; color: #fff; }

  .stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 32px 16px 64px; }
  .notes { width: 300px; position: sticky; top: 90px; background: #fff; border-radius: 12px; padding: 20px; font-size: 13px; line-height: 1.55; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .notes h3 { margin: 0 0 4px; font-size: 16px; }
  .notes .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .notes h4 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #888; }
  .notes ul { margin: 0; padding-left: 18px; }
  .notes li { margin: 3px 0; }
  @media (max-width: 1100px) { .stage { flex-direction: column; align-items: center; } .notes { position: static; width: 100%; max-width: 712px; } }

  /* ---------- E-Mail ---------- */
  .mail { width: 712px; max-width: 100%; background: #fff; box-shadow: 0 2px 18px rgba(0,0,0,.08); }
  /* Header 1:1 wie Vorlage: 712 × 64 px, Logo an gleicher Position */
  .mail-header { background: #000; height: 64px; position: relative; z-index: 1; }
  .logo { position: absolute; left: 19px; top: 4px; width: 136px; height: 52px; background: url(img/current-email.webp) no-repeat; background-position: -168px -115px; background-size: 1114px 2000px; filter: brightness(.9) contrast(4) grayscale(1); }
  /* nur Wortmarke „reservix“: Unterzeile „dein ticketportal“ abdecken, Schrägstrich bleibt */
  .logo::after { content: ""; position: absolute; left: 0; top: 39px; width: 92px; height: 13px; background: #000; }

  .badge { display: inline-flex; align-items: center; gap: 6px; background: var(--ok-bg); color: var(--ok-ink); font-weight: 700; font-size: 13px; padding: 6px 12px 6px 9px; border-radius: 999px; white-space: nowrap; }
  .badge .emoji { font-size: 15px; line-height: 1; margin-right: 2px; }
  .countdown { display: inline-flex; align-items: baseline; gap: 6px; font-size: 13px; font-weight: 600; color: #555; }
  .countdown b { font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
  .eyebrow { margin: 14px 0 4px; color: var(--muted); font-size: 14px; }
  .headline { margin: 0; font-size: 38px; line-height: 1.05; font-weight: 900; letter-spacing: -.03em; }
  /* „Vorfreude!“ in Button-Farbe (Reservix-Orange), gleiche Schrift wie die Headline */
  .headline mark { background: none; color: var(--brand); padding: 0; }
  .greet { padding: 4px 25px 8px; font-size: 14px; line-height: 1.6; color: #333; }
  .greet p { margin: 0 0 12px; }

  /* Polaroid-Grundbaustein */
  .polaroid { position: relative; background: #fff; padding: 10px 10px 38px; box-shadow: 0 16px 36px rgba(0,0,0,.26), 0 2px 4px rgba(0,0,0,.08); }
  .polaroid .pic { background-size: cover; background-position: center; }
  .polaroid .cap { position: absolute; left: 0; right: 0; bottom: 11px; text-align: center; font-size: 12px; font-weight: 600; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; }
  .polaroid .cap.hand { font-family: var(--hand); font-size: 22px; font-weight: 700; color: #2b2b2b; bottom: 4px; }

  .hero { position: relative; padding: 0 25px; }
  .row { display: flex; gap: 28px; align-items: center; }
  .txt { flex: 1; min-width: 0; }

  /* Text links, Polaroid rechts gekippt */
  .v2 .row { flex-direction: row; padding-top: 34px; }
  .v2 .polaroid { width: 270px; flex: none; transform: rotate(4deg); }
  .v2 .polaroid .pic { height: 240px; }
  .v2 .txt .badge { margin-bottom: 4px; }

  .hero + .greet { padding-top: 22px; }

  /* ---------- Rest der Mail (unverändert) ---------- */
  .details { margin: 12px 25px 0; border: 1px solid var(--line); }
  .details .head { background: #222; color: #fff; font-size: 12px; font-weight: 600; padding: 12px 16px; }
  .details .inner { padding: 18px 16px; }
  .ev-title { font-weight: 700; font-size: 15px; margin: 0 0 4px; }
  .ev-sub { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  .ev-row { display: flex; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .ev-facts { font-size: 12.5px; line-height: 1.9; flex: 1; }
  .ev-cal { width: 240px; flex: none; border-left: 1px solid var(--line); padding-left: 16px; font-size: 12.5px; }
  .ev-cal .cals { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: #555; text-align: center; }
  .ev-cal .cals i { display: block; width: 34px; height: 34px; border-radius: 6px; border: 1px solid #ddd; margin: 0 auto 4px; }
  .lines { padding-top: 14px; font-size: 12.5px; }
  .lines .cap { font-size: 10.5px; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .lines .r, .sum .r { display: flex; justify-content: space-between; padding: 5px 0; }
  .sum { background: #f7f7f7; border: 1px solid #eee; border-radius: 6px; padding: 12px 16px; margin-top: 10px; font-size: 12.5px; }
  .sum .g { color: #23964a; }
  .sum .tot { border-top: 1px solid #e2e2e2; margin-top: 6px; padding-top: 12px; font-weight: 700; }
  .sum .tot span:last-child { font-size: 17px; }
  .btns { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
  .btn { font-size: 13px; padding: 9px 26px; border: 1px solid #bbb; color: #555; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .twocol { display: flex; gap: 14px; margin: 18px 25px 0; }
  .twocol > div { flex: 1; border: 1px solid var(--line); padding: 16px; font-size: 12.5px; line-height: 1.6; }
  .twocol h5 { margin: 0 0 8px; font-size: 13px; }
  .tip { margin: 16px 25px 0; border: 1px solid #4a6fd8; border-radius: 4px; padding: 10px 14px; font-size: 11.5px; color: #333; }
  .legal { margin: 16px 25px 0; font-size: 12px; line-height: 1.6; color: #444; }
  .legal a { color: var(--brand); }
  .signoff { margin: 22px 25px 30px; font-size: 12.5px; font-weight: 600; line-height: 1.6; }
  .footer { background: #2a2a2a; color: #ccc; text-align: center; font-size: 11px; line-height: 1.8; padding: 28px 24px 34px; }
  .footer b { color: #fff; }

  .before img { display: block; width: 712px; max-width: 100%; }

  /* ---------- Mobil: Polaroid über dem Text ---------- */
  @media (max-width: 600px) {
    .row { flex-direction: column !important; align-items: stretch !important; gap: 8px; }
    .v2 .polaroid { width: 78%; margin: 0 auto; }
    .v2 .row { padding-top: 30px; }
    .v2 .polaroid .pic { height: 240px; }
    .row > .polaroid { order: -1; }
    .txt { padding: 12px 0 6px !important; }
    .headline { font-size: 30px; }
    .ev-row { flex-wrap: wrap; } .ev-cal { width: 100%; border-left: 0; padding-left: 0; }
    .twocol { flex-direction: column; }
  }
</style>

<div class="toolbar">
  <div class="group"><span>Event</span>
    <div class="seg" id="ev">
      <button data-v="lama" aria-pressed="true">Lama</button>
      <button data-v="flicflac">Flic Flac</button>
      <button data-v="itchy">Itchy</button>
    </div>
  </div>
  <div class="group"><span>Ansicht</span>
    <div class="seg" id="cp">
      <button data-v="v2" aria-pressed="true">C2 · Polaroid rechts</button>
      <button data-v="before">Vorher</button>
    </div>
  </div>
</div>

<div class="stage">
  <div class="mail" id="mail"></div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
const EVENTS = {
  lama: {
    title: 'Pfui Spucke Lama – Lama Weitspuckkontest', short: 'Pfui Spucke Lama', hand: 'Pfui Spucke Lama · 7.11.',
    org: 'Vorname Nachname', date: 'Sa, 7. November 2026, 20:00 Uhr', dateShort: '7. Nov 2026', place: 'Straße 1, 12345 Stadt',
    days: 24, img: 'img/lama.jpg',
    focus: 'center 30%', accent: '#f07d00'
  },
  flicflac: {
    title: 'Flic Flac – 17. Festival der Artisten', short: 'Festival der Artisten', hand: 'Flic Flac · 10.12.',
    org: 'Flic Flac by René Casselly', date: 'Do, 10. Dezember 2026, 19:30 Uhr', dateShort: '10. Dez 2026', place: 'Flic Flac Zelt, Kassel',
    days: 57, img: 'img/flicflac.webp',
    focus: 'center center', accent: '#f3dc1d'
  },
  itchy: {
    title: 'ITCHY – 25 Years The Tour', short: 'ITCHY · 25 Years', hand: 'ITCHY live · 12.3.',
    org: 'Musikkontor GmbH', date: 'Fr, 12. März 2027, 20:00 Uhr', dateShort: '12. März 2027', place: 'Musikzentrum, Hannover',
    days: 149, img: 'img/itchy.webp',
    focus: 'center center', accent: '#ff4f93'
  }
};

const BASE_TECH = 'Header unverändert (712 × 64 px, schwarz). Polaroid inkl. Drehung & Schatten wird serverseitig als ein Bild gerendert; Headline, Countdown und Text bleiben echtes HTML.';
const NOTES = {
  v2: { name: 'Polaroid rechts', idea: 'Polaroid rechts, leicht gekippt, mit handschriftlicher Bildunterschrift. Der Text steht links, der Status-Badge wieder klassisch über der Headline.',
        pros: ['„Vorfreude!“ in Button-Farbe – verbindet Hero und „Tickets herunterladen“', 'Handschrift-Bildunterschrift wirkt persönlich', 'Leserichtung: erst Botschaft, dann Bild'] },
  before: { name: 'Aktueller Stand', idea: 'Die heutige Bestellbestätigung zum Vergleich.', pros: [], ref: true }
};

const badge = (cls = '') => `<span class="badge ${cls}"><span class="emoji" aria-hidden="true">🎉</span>Bestellung bestätigt</span>`;
const countdown = e => `<span class="countdown">Noch <b>${e.days}</b> Tage</span>`;
const headline = `<p class="eyebrow">Vielen Dank für Ihre Bestellung!</p><h1 class="headline">Ab jetzt heißt es: <mark>Vorfreude!</mark></h1>`;
const greet = `<div class="greet"><p>Hallo <b>Vorname Nachname</b>,</p><p>danke für Ihre Bestellung vom 31. Juli 2026. Hier kommen Ihre Tickets!<br>Wir wünschen schon jetzt viel Freude bei der Veranstaltung.</p></div>`;
const header = `<div class="mail-header"><div class="logo"></div></div>`;
const pol = (e, { cap, hand = false } = {}) =>
  `<div class="polaroid"><div class="pic" style="background-image:url('${e.img}');background-position:${e.focus}"></div><div class="cap ${hand ? 'hand' : ''}">${cap}</div></div>`;

const HERO = {
  v2: e => `<div class="hero v2"><div class="row">
      <div class="txt">${badge()}${headline}<p class="eyebrow" style="margin-top:14px">${countdown(e)}</p></div>
      ${pol(e, { cap: e.hand, hand: true })}
    </div></div>`
};

const rest = e => `
  <div class="details">
    <div class="head">Bestelldetails · Bestellnummer 57484337</div>
    <div class="inner">
      <p class="ev-title">${e.title}</p>
      <p class="ev-sub">Veranstalter: ${e.org}</p>
      <div class="ev-row">
        <div class="ev-facts"><b>Datum:</b> ${e.date}<br><b>Ort:</b> ${e.place}</div>
        <div class="ev-cal"><b>Veranstaltung im Kalender speichern</b>
          <div class="cals"><div><i></i>Apple</div><div><i></i>Google</div><div><i></i>Outlook</div></div>
        </div>
      </div>
      <div class="lines">
        <div class="cap">ENTHALTENE TICKETS</div>
        <div class="r"><span>1 × Normalpreis</span><span>50,00 EUR</span></div>
        <div class="r"><span>1 × Normalpreis</span><span>50,00 EUR</span></div>
        <div class="r"><span>1 × Rollstuhl + Begleitperson</span><span>30,00 EUR</span></div>
      </div>
      <div class="sum">
        <div class="r"><span>Zwischensumme</span><span>130,00 EUR</span></div>
        <div class="r g"><span>Gutschein</span><span>− 10,00 EUR</span></div>
        <div class="r"><span>Servicegebühr</span><span>2,00 EUR</span></div>
        <div class="r tot"><span>Gesamtpreis</span><span>122,00 EUR</span></div>
      </div>
      <div class="btns"><span class="btn primary">Tickets herunterladen</span><span class="btn">Zum Kundenaccount</span></div>
    </div>
  </div>
  <div class="twocol">
    <div><h5>Rechnungsadresse</h5>Vorname Nachname<br>Strasse 1<br>12345 Stadt<br>Deutschland<br><br><b>Bezahlung:</b> PayPal</div>
    <div><h5>Ticketzustellung</h5><b>Lieferart:</b> print@home</div>
  </div>
  <div class="tip"><b>Tipp:</b> Bitte informieren Sie sich am Tag des Events über mögliche kurzfristige Änderungen oder Verlegungen auf der Webseite des Veranstalters.</div>
  <div class="legal">Der Ticketkauf erfolgt im Namen und auf Rechnung des Veranstalters. Wir selbst sind kein Veranstalter.<br>Bitte antworten Sie nicht direkt auf diese Nachricht, da es sich um eine automatisch generierte E-Mail handelt.<br>Bei Fragen zu Ihrer Bestellung hilft Ihnen unser Service-Team gerne über unser <a>Kontaktformular</a> weiter.</div>
  <div class="signoff">Herzliche Grüße<br>Ihr Reservix-Team</div>
  <div class="footer">Alle Angaben zu Veranstaltungen sind ausdrücklich ohne Gewähr.<br><br><b>Reservix GmbH</b><br>Humboldtstraße 2 · 79098 Freiburg im Breisgau</div>`;

const state = { ev: 'lama', cp: 'v2' };
try { const saved = JSON.parse(localStorage.getItem('polaroidState') || '{}'); if (EVENTS[saved.ev]) state.ev = saved.ev; if (NOTES[saved.cp]) state.cp = saved.cp; } catch (_) {}

function render() {
  const e = EVENTS[state.ev];
  const mail = document.getElementById('mail');
  document.documentElement.style.setProperty('--accent', e.accent);
  if (state.cp === 'before') {
    mail.className = 'mail before';
    mail.innerHTML = '<img src="img/current-email.webp" alt="Aktuelle Bestellbestätigung">';
  } else {
    mail.className = 'mail';
    mail.innerHTML = header + HERO[state.cp](e) + greet + rest(e);
  }
  const n = NOTES[state.cp];
  document.getElementById('notes').innerHTML = `
    <span class="tag">${n.ref ? 'Referenz' : 'Konzept C · Polaroid'}</span><h3>${n.name}</h3><p>${n.idea}</p>
    ${n.pros.length ? `<h4>Stärken</h4><ul>${n.pros.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    ${n.ref ? '' : `<h4>Umsetzung in der Mail</h4><p style="margin:0">${BASE_TECH}</p>`}`;
  for (const id of ['ev', 'cp'])
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state[id]));
  try { localStorage.setItem('polaroidState', JSON.stringify(state)); } catch (_) {}
}
for (const id of ['ev', 'cp'])
  document.getElementById(id).addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    state[id] = b.dataset.v; render();
  });
render();
</script>

</body></html>
